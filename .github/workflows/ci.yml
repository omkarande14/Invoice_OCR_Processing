name: CI Pipeline & Git Hygiene

on:
  push:
    branches: [ master, main, 'rrsi/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  hygiene-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest scipy numpy pydantic pyyaml pillow imagehash

      - name: Run Git Hygiene & PII Leak Check
        run: |
          python scripts/check_git_hygiene.py

      - name: Run Unit & Statistical Tests
        run: |
          pytest tests/test_rrsi_stats.py tests/test_rrsi_normalize.py tests/test_validators.py tests/test_table_metrics.py tests/test_reconciliation_bug.py
